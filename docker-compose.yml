# Lokal ishlab chiqish uchun: docker compose up --build
# Production sozlamalari (Nginx, HTTPS, backup) 6-bosqichda alohida qo'shiladi.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modiq}
      POSTGRES_USER: ${POSTGRES_USER:-modiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modiq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modiq}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-modiq}:${POSTGRES_PASSWORD:-modiq}@db:5432/${POSTGRES_DB:-modiq}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
